name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: .ruby-version
          bundler-cache: true
      - name: Run unit specs
        run: bundle exec rspec

  system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: .ruby-version
          bundler-cache: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # Layers are cached in the GitHub Actions cache: the image is rebuilt only when
      # spec/system/Dockerfile or entrypoint.sh change.
      - name: Build the system spec image
        uses: docker/build-push-action@v6
        with:
          context: spec/system
          tags: herd-system-spec
          load: true
          cache-from: type=gha,scope=herd-system-spec
          cache-to: type=gha,scope=herd-system-spec,mode=max
      - name: Run system specs against the Docker host
        run: bin/system-spec --profile 15
        env:
          HERD_SYSTEM_SKIP_BUILD: "1"
